[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentpet"
version = "0.2.0"
description = "Desktop pets for your coding agents: Clawd for Claude Code, Hermes for Hermes Agent."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6", "psutil>=5.9"]
keywords = ["desktop pet", "claude code", "hermes agent", "pixel art"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
]

[project.scripts]
agentpet = "agentpet.cli:main"

[project.urls]
Homepage = "https://github.com/jstjep00/AgentPet"
Issues = "https://github.com/jstjep00/AgentPet/issues"

[tool.setuptools]
packages = ["agentpet"]
